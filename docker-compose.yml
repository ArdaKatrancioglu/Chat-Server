services:
  mysql:
    image: mysql:8.4
    container_name: chat-server-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: chat_server
      MYSQL_USER: chat_api
      MYSQL_PASSWORD: chat_api_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
